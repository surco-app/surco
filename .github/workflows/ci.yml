name: CI

# The release workflow only bundles and ships; nothing gated lint, type-checks or
# tests, so regressions (e.g. a broken tsc build) could land on main unseen. This runs
# the checks on every push and PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Lockfile-pinned install: the root package.json pins every platform's rollup
      # binary into the lock (npm/cli#4828 would otherwise skip them cross-OS), so the
      # build uses the exact committed dependency tree instead of resolving fresh from
      # the registry. ffmpeg-static's postinstall download from GitHub Releases
      # intermittently 504s, so retry the install a few times.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Lint desktop
        run: npm run lint -w apps/desktop

      - name: Lint web
        run: npm run lint -w apps/web

      - name: Type-check desktop
        run: npx tsc --build
        working-directory: apps/desktop

      # The web build runs `tsc --noEmit` and then the SSG render, so it gates both
      # type errors and pages that throw at prerender time.
      - name: Build web
        run: npm run build -w apps/web

      - name: Test
        run: npm test

  # The USB export's Windows paths (drive letters, the PowerShell volume query, the guards)
  # are tested everywhere with fixtures; this job runs them on Windows itself and runs the
  # real PowerShell query, which no Mac can.
  usb-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: USB export tests
        working-directory: apps/desktop
        run: npx vitest run src/main/usbVolumes.test.ts src/main/usbExportMemory.test.ts src/main/bakenPath.test.ts src/main/bakenRun.test.ts src/main/bakenXml.test.ts src/main/usbExportStage.test.ts

      - name: The volume query runs and answers JSON
        shell: pwsh
        run: |
          $json = powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/desktop/src/main/windowsVolumes.ps1
          $vols = $json | ConvertFrom-Json
          if ($null -eq $vols) { throw 'no JSON from windowsVolumes.ps1' }
          Write-Output "volumes: $(@($vols).Count)"
          @($vols) | Where-Object { $_.DriveLetter -eq 'C:' -and -not $_.DeviceID } | ForEach-Object { throw 'C: without a volume GUID' }
