name: Test build

# Hand-launched build for a tester, deliberately separate from release.yml: that one
# only fires on a tag and publishes a live release to surco-releases, so before this
# existed the only way to get a Windows binary to a tester was to ship it to everyone.
# A Windows-only bug that cannot reproduce on the maintainer's macOS (the player
# holding a file open across an in-place rename) is exactly the case that needs a
# throwaway build first: v0.83.4 went out unverified and was still broken.
#
# Produces an unsigned installer as a workflow artifact. No tag, no release, nothing
# published. Windows SmartScreen will warn on an unsigned build — "More info" then
# "Run anyway" — which is expected here and not a sign of a bad download.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to build
        required: true
        default: main
      store:
        description: Also build the Microsoft Store package (.appx)
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Same retry as the release job: ffmpeg-static's postinstall pulls its binary
      # from GitHub Releases, which intermittently 504s.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Resolve Electron version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}

      # Electron 42+ dropped its install postinstall, so the binary has to be fetched
      # explicitly before electron-builder can package the app.
      - name: Fetch Electron binary
        shell: bash
        run: node node_modules/electron/install.js

      # baken (the USB export's writer) is built from pinned source plus Surco's patches, so
      # the Windows test installer carries baken.exe and its export tests run here.
      - name: Cache baken build
        if: runner.os != 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/.baken-build
          key: baken-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/vendor/baken/**') }}

      - name: Build baken
        shell: bash
        env:
          BAKEN_TEST: '1'
        run: node scripts/build-baken.mjs

      # No --publish, so electron-builder packages without touching surco-releases.
      - name: Build the installer
        working-directory: apps/desktop
        run: npm run dist -- --win --publish never

      # Artifact names reject "/", which any feature-branch ref would carry.
      - name: Build a safe artifact name
        id: name
        shell: bash
        run: echo "value=$(echo "${{ inputs.ref }}" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: surco-windows-test-${{ steps.name.outputs.value }}
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

      # The same package release.yml sends to the Microsoft Store, for checking it before a
      # tag or for the first submission to Partner Center by hand.
      - name: Build the Microsoft Store package
        if: inputs.store
        working-directory: apps/desktop
        run: npx electron-builder --win appx --x64 --publish never

      - if: inputs.store
        uses: actions/upload-artifact@v4
        with:
          name: surco-store-appx-${{ steps.name.outputs.value }}
          path: apps/desktop/dist/*.appx
          if-no-files-found: error

  # The USB export bundles a native helper (baken) that must be signed with the Developer
  # ID and covered by notarization like the app. Verified here, by hand-launched build, before
  # a release tag ever runs: nothing is published.
  mac-signed:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Fetch Electron binary
        run: node node_modules/electron/install.js

      - name: Build baken
        env:
          BAKEN_TEST: '1'
        run: node scripts/build-baken.mjs

      - name: Write Apple API key
        run: echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"

      - name: Build, sign and notarize without publishing
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npx electron-vite build
          npx electron-builder --mac --arm64 --publish never

      - name: Check baken is signed, hardened and notarized
        working-directory: apps/desktop
        run: |
          set -o pipefail
          APP=$(ls -d dist/mac-arm64/Surco.app)
          codesign -dv --verbose=4 "$APP/Contents/Resources/baken/baken" 2>&1 | tee baken-sign.txt
          grep -q 'Authority=Developer ID Application' baken-sign.txt
          grep -q 'flags=0x10000(runtime)' baken-sign.txt
          codesign --verify --deep --strict "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP"
          "$APP/Contents/Resources/baken/baken" expressport --help | grep -q -- '--json'

      - uses: actions/upload-artifact@v4
        with:
          name: surco-mac-signed-${{ github.run_id }}
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error
