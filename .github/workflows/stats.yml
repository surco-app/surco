name: Stats

# GitHub keeps only today's download totals, so the stats page's history is whatever this
# stores each day. It lives on a `stats` branch of the releases repo, which the page reads
# straight from raw.githubusercontent.com: a commit on main would redeploy the site every
# time, and a branch of this repo gets a failed Vercel build per commit.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency: stats

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check out the stats branch of the releases repo, or start it
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/stats"
          git init -q -b stats "$dir"
          git -C "$dir" remote add origin \
            "https://x-access-token:${RELEASES_TOKEN}@github.com/surco-app/surco-releases.git"
          if git -C "$dir" fetch --depth=1 origin stats; then
            git -C "$dir" reset --hard FETCH_HEAD
          elif git fetch --depth=1 origin stats; then
            git show FETCH_HEAD:stats.json > "$dir/stats.json"
          fi

      - name: Record today's totals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/web/scripts/stats-snapshot.ts "$RUNNER_TEMP/stats/stats.json"

      - name: Commit the snapshot
        working-directory: ${{ runner.temp }}/stats
        run: |
          git add stats.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Record download stats for $(date -u +%F)"
          git push origin stats
