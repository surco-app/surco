# Weekly checks, grouped so the batch stays mergeable: Electron on its own (its
# patch releases carry Chromium security fixes and should not wait for a batch),
# Biome on its own (its minors add lint rules that fail CI until the code is
# fixed), React on its own (a minor changes how it renders, so it gets tested
# apart), every other minor and patch as one batch PR, and each major as its own
# PR.
#
# NOTE: a PR that bumps `electron` only updates package.json — the pinned
# `electronVersion` in apps/desktop/electron-builder.yml must be bumped by hand
# in the same merge, or releases would bundle the old runtime.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Majors on the toolchain are real migrations, not bumps, so they must be
    # done by hand in a dedicated branch, not swept into the weekly batch:
    # Vite 8 (blocked until electron-vite ships stable Vite 8 support — v6
    # is still in beta), @vitejs/plugin-react 6 (rolldown-only, requires
    # Vite 8), react-router-dom 7 (blocked: vite-react-ssg peers at ^6.14.1
    # with no v7-compatible release). Remove an entry once its migration
    # lands.
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]
    groups:
      electron:
        patterns:
          - electron
      biome:
        patterns:
          - "@biomejs/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - electron
          - "@biomejs/*"
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
